# Shape Up for kandev: cycles, bets, appetite and a circuit breaker.
#
# `id` must match go.mod's module, the Makefile's BIN and the id passed to
# window.registerKandevPlugin in ui/bundle.js.
id: "kandev-plugin-shapeup"
api_version: 2
version: "0.1.1"
display_name: "Shape Up"
description: "Fixed cycles, bets with an appetite and a circuit breaker that cuts unfinished work at the deadline instead of extending it."
author: "Michele Scotellaro"
categories: ["tools"]

# 0.97.0 is the only release this plugin has been checked against: it is the
# SDK pin in .kandev-sdk-ref and carries the exact (Host v2) task archive the
# circuit breaker uses.
min_kandev_version: "0.97.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# state:              cycles and bets live in plugin Host state.
# api_read tasks:     task list for bets, task versions for archiving.
# api_read workflows: step names, to offer tasks at the "Betting table" first.
# api_write tasks:    the exact archive command. It also needs the workspace
#                     grant host.v2.write:tasks (Settings > Plugins > Shape Up >
#                     Workspace access); without it the breaker cannot cut.
capabilities:
  state: true
  api_read: ["tasks", "workflows"]
  api_write: ["tasks"]

# Browser actions for the betting table page. The host authenticates the
# caller and verifies the workspace before calling HandleAction. Every
# mutating action decides which tasks get archived, so they are admin only.
actions:
  - key: "state.get"
    scope: "workspace"
    access: "authenticated"
    max_body_bytes: 1024
  - key: "tasks.candidates"
    scope: "workspace"
    access: "authenticated"
    max_body_bytes: 1024
  - key: "cycle.start"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "bet.place"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "bet.ship"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "bet.cut"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024

ui:
  bundle: "/ui/bundle.js"
